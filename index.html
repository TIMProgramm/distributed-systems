/* ===== Исправления: адаптив, меню, мелкие ошибки ===== */
:root{--hf:Manrope,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
html{-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
.app-shell{min-height:100vh;min-height:100dvh;max-width:100%}
.main-area{min-width:0}
.sidebar{height:100vh;height:100dvh;overflow-y:auto;overscroll-behavior:contain}
.sidebar-close{display:none;position:absolute;top:14px;right:12px;width:36px;height:36px;border:0;border-radius:10px;background:#ffffff14;color:#fff;font-size:18px;line-height:1;align-items:center;justify-content:center;padding:0}
.sidebar-close:hover{background:#ffffff26}
.overlay{display:none;position:fixed;inset:0;background:#0c1425a8;z-index:9;-webkit-tap-highlight-color:transparent}
.overlay.show{display:block}
body.menu-open,body.modal-open{overflow:hidden}
.grid-main>*,.stats>*,.lesson-list>*,.homework-grid>*,.teacher-grid>*,.quiz-settings>*,.welcome>*,.panel,.lesson-card,.task-card,.stat-card>div{min-width:0}
h1,h2,h3,p,td,th,small,.q-title,.option,.outcome span,.crumb strong,.stat-card small{overflow-wrap:break-word}
.tag{border:0;font-family:inherit;line-height:1.2}
button.tag{cursor:pointer}
.panel-head{flex-wrap:wrap;gap:8px}
.lesson-top{gap:8px;flex-wrap:wrap}
.lesson-foot,.task-foot{gap:10px;flex-wrap:wrap}
.quiz-nav{flex-wrap:wrap;gap:10px}
.modal-actions{flex-wrap:wrap}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.plan-table.wide{min-width:520px}
.plan-table select{max-width:100%}
.btn{font-family:inherit;line-height:1.2}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none;box-shadow:none}
.search-row input{min-width:0;flex:1}
.option{min-width:0}.option span{min-width:0}
.option.wrong{border-color:#e25d6b;background:#fff0f1}
.quiz-hero>div{position:relative;z-index:1;min-width:0}
.crumb{min-width:0}.crumb strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{flex-shrink:0}
.toast{max-width:calc(100vw - 30px)}
.panel>.btn{margin:4px 2px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #7185ff;outline-offset:2px}
.dark{color-scheme:dark}
.dark .option:hover{background:#1f2c45;border-color:#4a5cc8}
.dark .option.wrong{background:#3a2229}
.dark .btn.danger{background:#3a2229;color:#ff8a96}
@media(max-width:900px){.grid-main{grid-template-columns:1fr}}
@media(max-width:820px){.lesson-list,.homework-grid,.teacher-grid,.quiz-settings{grid-template-columns:1fr}}
@media(max-width:760px){
.sidebar{width:min(280px,86vw);z-index:20}
.overlay{z-index:15}
.sidebar-close{display:flex}
.topbar{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.mobile-menu{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;margin:0 8px 0 0;padding:0;border-radius:10px;font-size:22px;line-height:1;flex-shrink:0}
.crumb{flex:1;font-size:13px}.crumb span,.crumb b{display:none}
.content{padding:20px 14px 32px}
.welcome{gap:14px}.section-head h1{font-size:21px}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat-card small{line-height:1.3;font-size:11px}
.lesson-card h3,.task-card h3{font-size:14px}
.lesson-card p,.task-card p{font-size:12px}
.btn{font-size:12px;padding:11px 14px;min-height:40px}
.tag{font-size:10px}
.option{font-size:13px;padding:13px 12px}
.plan-table{font-size:12px}.plan-table th{font-size:10px}
.outcome,.upcoming b{font-size:12px}
.upcoming small,.progress-meta,.panel-head small,.section-head p,.welcome p,.lesson-foot,.task-foot{font-size:11px}
.upcoming>div:nth-child(2){flex:1;min-width:0}
.field label{font-size:12px}
.search-row input,.field input,.field textarea,.field select{font-size:16px}
.section-head>.btn,.quiz-hero .btn{width:100%}
.quiz-nav .btn{flex:1 1 auto}
.quiz-nav>span{order:-1;flex-basis:100%;text-align:center}
.quiz-question{padding:16px}
.modal{padding:18px;border-radius:14px}
.modal-actions .btn{flex:1 1 auto}
.toast{left:15px;right:15px;bottom:max(15px,env(safe-area-inset-bottom));text-align:center}
footer{text-align:center;align-items:center}
}
@media(max-width:380px){.stats{grid-template-columns:1fr}.welcome-art{display:none}.avatar{display:none}.content{padding:18px 12px 28px}}

/* ===== Картинки предметов ===== */
.subj-art{height:112px;border-radius:12px;margin-bottom:14px;position:relative;overflow:hidden;display:grid;place-items:center;background:var(--g);box-shadow:0 8px 18px #536dfe22}
.subj-art:before,.subj-art:after{content:'';position:absolute;border:1px solid #ffffff44;border-radius:50%;width:120px;height:120px;right:-18px;top:-26px}
.subj-art:after{width:76px;height:76px;left:-14px;right:auto;top:auto;bottom:-24px}
.subj-art svg{position:relative;z-index:1;height:88px;width:auto;max-width:90%;filter:drop-shadow(0 4px 8px #0003)}
.subj-art.wide{height:150px;margin-bottom:18px;border-radius:16px}
.subj-art.wide svg{height:116px}
@media(max-width:760px){.subj-art.wide{height:120px}.subj-art.wide svg{height:92px}}

/* ===== Картинки страниц, герой, пустые состояния ===== */
.welcome-art{width:220px;height:120px;display:grid;place-items:center}
.welcome-art:before,.welcome-art:after{display:none}
.welcome-art svg{position:relative;width:100%;height:100%;filter:drop-shadow(0 4px 10px #0003)}
.page-art{width:170px;height:92px;flex-shrink:0;border-radius:16px;background:var(--g);position:relative;overflow:hidden;display:grid;place-items:center;box-shadow:0 10px 22px #536dfe2e}
.page-art:before,.page-art:after{content:'';position:absolute;border:1px solid #ffffff44;border-radius:50%;width:100px;height:100px;right:-16px;top:-24px}
.page-art:after{width:60px;height:60px;left:-12px;right:auto;top:auto;bottom:-20px}
.page-art svg{position:relative;z-index:1;height:66px;width:auto;filter:drop-shadow(0 3px 6px #0003)}
.section-head{gap:18px}
.empty-art{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:#eef0ff;color:#536dfe;display:grid;place-items:center}
.empty-art svg{width:36px;height:36px}
.dark .empty-art{background:#28345a;color:#aebaff}
@media(max-width:760px){
.welcome-art{width:118px;height:80px}
.page-art{width:100%;height:84px}.page-art svg{height:60px}
}
@media(max-width:380px){.welcome-art{display:grid;width:96px;height:68px}}
.search-row{align-items:center}.search-row .tag{flex-shrink:0;padding:8px 10px}

/* ===== Календарь ===== */
.cal-panel{padding:20px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cal-top h2{font:800 18px var(--hf);margin:0}
.cal-ctrl{display:flex;gap:8px;align-items:center}
.cal-nav{width:38px;height:38px;padding:0;font-size:20px;line-height:1;display:grid;place-items:center;min-height:0}
.cal-dow,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow span{text-align:center;font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--muted);padding:4px 0 8px}
.cal-dow span:nth-child(n+6){color:#c9822e}
.cal-day{border:1px solid var(--line);background:var(--surface2);border-radius:11px;min-height:92px;padding:8px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;text-align:left;color:var(--text);transition:.15s;min-width:0;font-family:inherit}
.cal-day:hover{border-color:#a8b3ff;background:#f8f9ff;transform:translateY(-1px)}
.cal-day b{font:700 12px var(--hf);width:26px;height:26px;display:grid;place-items:center;border-radius:8px;flex-shrink:0}
.cal-day.out{opacity:.4}
.cal-day.holiday{background:#fffaf2}
.cal-day.today b{background:var(--accent);color:#fff;box-shadow:0 5px 12px #536dfe44}
.cal-day.sel{border-color:#7185ff;background:#f0f2ff;box-shadow:0 0 0 3px #536dfe22}
.cal-marks{display:flex;flex-direction:column;gap:4px;width:100%;min-width:0}
.cal-chip{display:block;font-style:normal;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-chip.lec{background:#edf0ff;color:#536dfe}.cal-chip.prac{background:#e8f8f8;color:#1f9aa0}.cal-chip.hol{background:#fff3e5;color:#c9822e}
.cal-legend{display:flex;gap:8px 18px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:var(--muted);align-items:center}
.cal-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.dot.lec{background:var(--accent)}.dot.prac{background:var(--cyan)}.dot.hol{background:var(--orange)}
#calGrid,#calDetail{scroll-margin-top:90px}
.cal-detail .panel-head h2{font-size:16px}
.cal-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fact{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--text)}
.cal-events{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:13px}
.cal-event{border-left:4px solid var(--accent)}
.cal-event.prac{border-left-color:var(--cyan)}
.cal-event .cal-facts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.cal-event p{margin-bottom:14px}
.cal-settings summary{cursor:pointer;font:800 15px var(--hf);list-style:none;display:flex;align-items:center;gap:8px}
.cal-settings summary::-webkit-details-marker{display:none}
.cal-settings summary:after{content:'▾';margin-left:auto;color:var(--muted)}
.cal-settings[open] summary:after{content:'▴'}
.cal-settings-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.plan-table tr.row-link{cursor:pointer}
.plan-table tr.row-link:hover td{background:var(--surface2)}
.dark .cal-day:hover{background:#1f2c45;border-color:#4a5cc8}
.dark .cal-day.sel{background:#243157;border-color:#6377ee}
.dark .cal-day.holiday{background:#2a2530}
.dark .cal-chip.lec{background:#26335b;color:#aebaff}.dark .cal-chip.prac{background:#1c3b43;color:#6fd6da}.dark .cal-chip.hol{background:#3a3023;color:#f1b872}
@media(max-width:760px){
.cal-panel{padding:14px 10px}
.cal-top{padding:0 4px}.cal-top h2{font-size:16px}
.cal-dow,.cal-grid{gap:4px}
.cal-day{min-height:54px;padding:6px 2px;align-items:center;gap:4px;border-radius:9px}
.cal-day b{font-size:13px}
.cal-marks{flex-direction:row;justify-content:center;flex-wrap:wrap;gap:3px}
.cal-chip{width:7px;height:7px;padding:0;border-radius:50%}
.cal-chip span{display:none}
.cal-chip.lec{background:var(--accent)}.cal-chip.prac{background:var(--cyan)}.cal-chip.hol{background:var(--orange)}
.cal-settings-grid{grid-template-columns:1fr}
.cal-events{grid-template-columns:1fr}
}

function openLesson(type,i){let arr=type==='lecture'?allLectures():allPractice(),x=arr[i];if(!x)return;let isPractice=type==='practice';modal(`<div class="eyebrow-light">${isPractice?'ПРАКТИЧЕСКОЕ ЗАНЯТИЕ':'ЛЕКЦИОННЫЙ МАТЕРИАЛ'}</div><h2>${esc(x.title)}</h2><p class="muted">${x.hours} ${plural(x.hours,['академический час','академических часа','академических часов'])} · ${C.code}</p><div class="panel" style="box-shadow:none;background:var(--surface2)"><b style="font-size:12px">${isPractice?'Цель и содержание задания':'Краткое содержание темы'}</b><p style="font-size:12px;line-height:1.8">${esc(x.desc)}</p>${isPractice?'<p style="font-size:11px;line-height:1.7">Подготовьте краткий отчёт: цель работы, схема или алгоритм, ход выполнения, результат и вывод. При необходимости используйте примеры из лекционного материала.</p>':'<p style="font-size:11px;line-height:1.7">При изучении темы обратите внимание на основные определения, архитектурные решения, ограничения и практические сценарии применения. Рекомендуется законспектировать ключевые термины и подготовить вопросы для обсуждения.</p>'}</div><div class="modal-actions"><button class="btn light" onclick="window.closeModal()">Закрыть</button><button class="btn" onclick="window.markDone('${type}-${i}')">Отметить изученным</button></div>`)}

/* ===== Календарь занятий ===== */
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD_FULL=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const WD_SHORT=['вс','пн','вт','ср','чт','пт','сб'];
const HOLIDAYS={'01-01':'Новый год','03-08':'Международный женский день','03-21':'Навруз','05-09':'День памяти и почестей','09-01':'День независимости','10-01':'День учителя и наставника','12-08':'День Конституции'};
const holidayName=d=>HOLIDAYS[pad(d.getMonth()+1)+'-'+pad(d.getDate())]||'';
const fmtPairs=h=>{const n=h/2;return Number.isInteger(n)?n+' '+plural(n,['пара','пары','пар']):String(n).replace('.',',')+' пары'};
const fmtLong=d=>WD_FULL[d.getDay()]+', '+d.getDate()+' '+MONTHS_GEN[d.getMonth()]+' '+d.getFullYear();
const fmtShort=d=>WD_SHORT[d.getDay()]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
const DEF_CAL={start:'2026-09-07',lec:1,prac:4};
let cal=null, calSel=null, calView=null;
function buildCal(){
  const cfg=Object.assign({},DEF_CAL,store.get('calCfg',{}));
  let start=pdate(cfg.start);if(isNaN(start))start=pdate(DEF_CAL.start);
  const map={},list=[];
  const gen=(items,wd,type)=>{let cur=start;items.forEach((x,i)=>{let g=0;while((cur.getDay()!==wd||holidayName(cur))&&g++<400)cur=addDays(cur,1);const k=dkey(cur);const ev={type,n:i+1,total:items.length,idx:i,title:x.title,hours:Number(x.hours)||2,desc:x.desc||'',key:k};(map[k]=map[k]||[]).push(ev);list.push(ev);cur=addDays(cur,1)})};
  gen(allLectures(),Number(cfg.lec),'lecture');gen(allPractice(),Number(cfg.prac),'practice');
  list.sort((a,b)=>a.key<b.key?-1:a.key>b.key?1:a.type===b.type?0:a.type==='lecture'?-1:1);
  const keys=list.map(e=>e.key);
  return {cfg,start,map,list,first:keys[0]||dkey(start),last:keys[keys.length-1]||dkey(start),base:addDays(start,-((start.getDay()+6)%7))};
}
function weekOf(k){const d=pdate(k),b=cal.base;return Math.floor(Math.round((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/864e5)/7)+1}
function calGridHtml(){
  const y=calView.y,m=calView.m,first=new Date(y,m,1),offset=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),rows=Math.ceil((offset+days)/7),gs=addDays(first,-offset),tk=dkey(new Date());
  let cells='';
  for(let i=0;i<rows*7;i++){
    const d=addDays(gs,i),k=dkey(d),ev=cal.map[k]||[],hol=holidayName(d);
    const chips=ev.map(e=>`<i class="cal-chip ${e.type==='lecture'?'lec':'prac'}"><span>${e.type==='lecture'?'Лекция':'Практика'} ${e.n}</span></i>`).join('')+(hol?'<i class="cal-chip hol"><span>Праздник</span></i>':'');
    const label=fmtLong(d)+(ev.length?'. Занятий: '+ev.length:'')+(hol?'. '+hol:'');
    cells+=`<button type="button" class="cal-day${d.getMonth()!==m?' out':''}${k===tk?' today':''}${k===calSel?' sel':''}${hol?' holiday':''}" onclick="window.calPick('${k}')" aria-label="${esc(label)}"${k===calSel?' aria-pressed="true"':''}><b>${d.getDate()}</b><span class="cal-marks">${chips}</span></button>`;
  }
  return `<div class="panel cal-panel"><div class="cal-top"><h2>${MONTHS[m]} ${y}</h2><div class="cal-ctrl"><button type="button" class="btn light cal-nav" onclick="window.calMove(-1)" aria-label="Предыдущий месяц">‹</button><button type="button" class="btn ghost" onclick="window.calToday()">Сегодня</button><button type="button" class="btn light cal-nav" onclick="window.calMove(1)" aria-label="Следующий месяц">›</button></div></div><div class="cal-dow"><span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span></div><div class="cal-grid">${cells}</div><div class="cal-legend"><span><i class="dot lec"></i>Лекция</span><span><i class="dot prac"></i>Практическое занятие</span><span><i class="dot hol"></i>Праздничный день</span><span class="muted">Нажмите на число, чтобы увидеть план дня</span></div></div>`;
}
function calDetailHtml(){
  const d=pdate(calSel),ev=cal.map[calSel]||[],hol=holidayName(d),inRange=calSel>=dkey(cal.base)&&calSel<=cal.last,done=store.get('completed',[]);
  const pairs=ev.reduce((a,e)=>a+e.hours,0);
  const head=`<div class="panel-head"><h2>${fmtLong(d)}</h2>${inRange?`<span class="tag">Неделя ${weekOf(calSel)}</span>`:''}</div>`;
  if(!ev.length){
    const nx=cal.list.find(e=>e.key>calSel);
    const msg=hol?'Праздничный день: '+esc(hol)+'. Занятий нет.':'В этот день занятий нет.';
    const nxt=nx?`<p class="muted" style="font-size:12px;margin:0 0 14px">Ближайшее занятие: <b>${nx.type==='lecture'?'Лекция':'Практика'} ${nx.n}</b> · ${fmtShort(pdate(nx.key))}</p><button type="button" class="btn ghost" onclick="window.calJump('${nx.key}')">Перейти к занятию →</button>`:'<p class="muted" style="font-size:12px;margin:0">Все занятия по плану уже пройдены.</p>';
    return `<div class="panel cal-detail">${head}<div class="empty" style="padding:22px 10px"><div class="empty-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></div><b style="display:block;color:var(--text);font-size:14px;margin-bottom:8px">${msg}</b>${nxt}</div></div>`;
  }
  const cards=ev.map(e=>{const lec=e.type==='lecture',isDone=done.includes(e.type+'-'+e.idx);return `<article class="lesson-card cal-event ${lec?'lec':'prac'}"><div class="lesson-top"><span class="lesson-no">${lec?'ЛЕКЦИЯ':'ПРАКТИЧЕСКОЕ ЗАНЯТИЕ'} · ${e.n} ИЗ ${e.total}</span><span class="tag ${isDone?'green':''}">${isDone?'Изучено':lec?'Лекция':'Практика'}</span></div><h3>${esc(e.title)}</h3><div class="cal-facts"><span class="fact">⏱ ${hrs(e.hours)}</span><span class="fact">▦ ${fmtPairs(e.hours)}</span><span class="fact">${lec?'Теоретический материал':'Практическое задание'}</span></div><b style="font-size:11px">${lec?'Содержание темы':'Задание'}</b><p style="margin-top:6px">${esc(e.desc||'Описание не добавлено.')}</p><div class="lesson-foot"><span>${esc(C.code)} · ${esc(C.title)}</span><button type="button" class="btn ghost" onclick="window.openLesson('${e.type}',${e.idx})">Открыть тему</button></div></article>`}).join('');
  return `<div class="panel cal-detail">${head}<div class="cal-summary"><span class="fact">Занятий: <b>${ev.length}</b></span><span class="fact">Всего: <b>${fmtPairs(pairs)}</b> (${hrs(pairs)})</span></div><div class="cal-events">${cards}</div></div>`;
}
function renderCal(grid=true){if(grid&&$('#calGrid'))$('#calGrid').innerHTML=calGridHtml();if($('#calDetail'))$('#calDetail').innerHTML=calDetailHtml()}

function calMove(n){const d=new Date(calView.y,calView.m+n,1);calView={y:d.getFullYear(),m:d.getMonth()};renderCal(true)}
function calToday(){calSet(dkey(new Date()))}
function calApply(){const v=$('#calStart').value;if(!v||isNaN(pdate(v))){toast('Укажите дату начала');return}store.set('calCfg',{start:v,lec:Number($('#calLec').value),prac:Number($('#calPrac').value)});calSel=null;calView=null;render();toast('Календарь обновлён')}

  cal=buildCal();

  if(!calView){const d=pdate(calSel);calView={y:d.getFullYear(),m:d.getMonth()}}
  const L=cal.list.filter(e=>e.type==='lecture'),P=cal.list.filter(e=>e.type==='practice'),sum=a=>a.reduce((t,e)=>t+e.hours,0),fd=pdate(cal.first),ld=pdate(cal.last);
  const dm=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1);

  const rows=cal.list.map(e=>`<tr class="row-link" onclick="window.calJump('${e.key}')" title="Показать в календаре"><td>${fmtShort(pdate(e.key))}</td><td>${e.type==='lecture'?'Лекция':'Практика'} ${e.n}</td><td>${esc(e.title)}</td><td>${hrs(e.hours)} · ${fmtPairs(e.hours)}</td><td>${e.type==='lecture'?'Лекционное занятие':'Практическое занятие'}</td></tr>`).join('');
  return `${section('Календарный план занятий','Календарь занятий и тематический план · 7-й семестр · 90 аудиторных часов')}
<div class="stats"><div class="stat-card"><div class="stat-icon">▤</div><div><strong>${L.length}</strong><small>Лекций · ${fmtPairs(sum(L))}</small></div></div><div class="stat-card"><div class="stat-icon cyan">⌘</div><div><strong>${P.length}</strong><small>Практик · ${fmtPairs(sum(P))}</small></div></div><div class="stat-card"><div class="stat-icon green">◉</div><div><strong>${sum(cal.list)/2}</strong><small>Всего пар</small></div></div><div class="stat-card"><div class="stat-icon orange">▦</div><div><strong style="font-size:16px">${dm(fd)} – ${dm(ld)}</strong><small>Период занятий</small></div></div></div>

<div class="panel"><div class="panel-head"><h2>Распределение часов</h2><span class="tag">180 часов</span></div><div class="table-wrap"><table class="plan-table wide"><thead><tr><th>Вид занятий</th><th>Количество</th><th>Часы</th><th>Самостоятельная работа</th></tr></thead><tbody><tr><td>Лекции</td><td>15 тем</td><td>44</td><td>—</td></tr><tr><td>Практические занятия</td><td>15 тем</td><td>46</td><td>—</td></tr><tr><td>Самостоятельная работа</td><td>30 заданий</td><td>—</td><td>90</td></tr><tr><td>Итого</td><td>—</td><td>90 аудиторных</td><td>90</td></tr></tbody></table></div></div>

function control(){return `${section('Промежуточный контроль','Контроль знаний по дисциплине · тестовый банк из 200 вопросов')}<div class="quiz-hero"><div><div class="eyebrow" style="color:#c5ceff">INTERMEDIATE ASSESSMENT</div><h2>Промежуточная контрольная работа</h2><p>Вопросы охватывают архитектуру распределённых систем, RPC, время и состояние, репликацию, консенсус, транзакции, хранилища, P2P, вычисления, блокчейн и IoT.</p><button class="btn" onclick="window.startQuiz()">Начать тестирование →</button></div></div><div class="panel"><div class="panel-head"><h2>Параметры тестирования</h2><span class="tag green">Готово к запуску</span></div><div class="quiz-settings"><div class="setting"><b>200 вопросов</b><small>Полный банк вопросов по силлабусу</small></div><div class="setting"><b>Случайная выборка</b><small>Порядок вопросов и ответов перемешивается</small></div><div class="setting"><b>Автоматическая проверка</b><small>Результат и процент правильных ответов</small></div></div><div class="field"><label>Количество вопросов в попытке</label><select id="quizCount"><option value="20">20 вопросов · короткая попытка</option><option value="40" selected>40 вопросов · стандартная попытка</option><option value="60">60 вопросов · расширенная попытка</option><option value="100">100 вопросов · полная проверка</option><option value="200">200 вопросов · весь банк</option></select></div><div class="field"><label>Время на выполнение</label><select id="quizTime"><option value="0">Без ограничения</option><option value="30">30 минут</option><option value="45" selected>45 минут</option><option value="60">60 минут</option><option value="90">90 минут</option></select></div><p class="muted" style="font-size:10px;line-height:1.6">Демо-режим: результаты сохраняются в локальном хранилище текущего браузера. Для официального проведения контрольной с удалённой сдачей необходим сервер и учётные записи.</p></div>`}
function startQuiz(){let count=Number($('#quizCount')?.value||40),mins=Number($('#quizTime')?.value||45);let pool=shuffle(BANK).slice(0,count);quiz={questions:pool.map(q=>({...q,options:shuffle(q.options.map((o,i)=>({o,correct:i===q.a})))})),answers:{},index:0,started:Date.now(),duration:mins*60};stopTimer();if(quiz.duration)timerId=setInterval(tickTimer,1000);quizRender()}
function stopTimer(){clearInterval(timerId);timerId=null}
function timeLeft(){return quiz.duration-(Date.now()-quiz.started)/1000}
function tickTimer(){if(!quiz||!quiz.duration){stopTimer();return}const left=timeLeft();if(left<=0){stopTimer();toast('Время вышло — тест завершён');finishQuiz(true);return}const el=$('#quizTimer');if(el)el.textContent=fmtTime(left)+' осталось'}
function quizRender(keepScroll){if(!quiz)return;let q=quiz.questions[quiz.index],idx=quiz.index+1,pct=idx/quiz.questions.length*100;$('#content').innerHTML=`${section('Тестирование','Промежуточный контроль · '+C.code)}<div class="panel"><div class="panel-head"><b>Вопрос ${idx} из ${quiz.questions.length}</b><span class="tag" id="quizTimer">${quiz.duration?fmtTime(timeLeft())+' осталось':'Без ограничения времени'}</span></div><div class="q-progress"><span style="width:${pct}%"></span></div><div class="quiz-question"><div class="lesson-no">ТЕМА: ${esc(q.topic)}</div><div class="q-title">${esc(q.q)}</div>${q.options.map((o,i)=>`<label class="option ${quiz.answers[q.id]===i?'selected':''}"><input type="radio" name="answer" ${quiz.answers[q.id]===i?'checked':''} onchange="window.chooseAnswer(${q.id},${i})"><span>${esc(o.o)}</span></label>`).join('')}</div><div class="quiz-nav"><button class="btn light" ${idx===1?'disabled':''} onclick="window.quizPrev()">← Назад</button><span class="muted" style="font-size:10px">Отвечено: ${Object.keys(quiz.answers).length}/${quiz.questions.length}</span>${idx===quiz.questions.length?'<button class="btn" onclick="window.finishQuiz()">Завершить тест</button>':'<button class="btn" onclick="window.quizNext()">Следующий вопрос →</button>'}</div></div>`;if(!keepScroll)window.scrollTo(0,0)}
function chooseAnswer(id,i){if(!quiz)return;quiz.answers[id]=i;quizRender(true)};function quizPrev(){quiz.index=Math.max(0,quiz.index-1);quizRender()}function quizNext(){quiz.index=Math.min(quiz.questions.length-1,quiz.index+1);quizRender()}
function finishQuiz(auto){if(!quiz)return;if(auto!==true){const un=quiz.questions.length-Object.keys(quiz.answers).length;if(un>0&&!confirm('Не отвечено вопросов: '+un+'. Завершить тест?'))return}stopTimer();let correct=0;quiz.questions.forEach(q=>{if(q.options[quiz.answers[q.id]]?.correct)correct++});let pct=Math.round(correct/quiz.questions.length*100),result={date:new Date().toLocaleString('ru-RU'),name:C.teacher,group:C.group,total:quiz.questions.length,correct,pct,grade:pct>=86?'Отлично':pct>=71?'Хорошо':pct>=60?'Удовлетворительно':'Требуется повторение'};let history=store.get('quizResults',[]);history.unshift(result);store.set('quizResults',history);quizResult={result,questions:quiz.questions,answers:quiz.answers};quiz=null;showQuizResult()}
function showQuizResult(){let r=quizResult.result;$('#content').innerHTML=`${section('Результат контрольной работы','Попытка завершена · '+r.date)}<div class="panel" style="text-align:center;padding:34px"><div class="empty-art" style="margin:0 auto 14px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="7"/><path d="M8.21 13.89L7 23l5-3 5 3-1.21-9.12"/></svg></div><div class="eyebrow-light">ВАШ РЕЗУЛЬТАТ</div><div class="result-score">${r.pct}%</div><h2 style="font:800 20px var(--hf)">${r.grade}</h2><p class="muted" style="font-size:11px">Правильных ответов: ${r.correct} из ${r.total}</p><div class="progress-line" style="max-width:420px;margin:20px auto"><span style="width:${r.pct}%"></span></div><button class="btn" onclick="window.reviewQuiz()">Посмотреть разбор ответов</button> <button class="btn ghost" onclick="window.go('control')">Новая попытка</button></div>`}
function reviewQuiz(){let q=quizResult.questions;$('#content').innerHTML=`${section('Разбор ответов','Проверка правильных вариантов и пояснений')}<div>${q.map((x,i)=>{let chosen=x.options[quizResult.answers[x.id]],ok=chosen?.correct;return `<div class="quiz-question"><div class="lesson-top"><span class="lesson-no">ВОПРОС ${i+1} · ${esc(x.topic)}</span><span class="tag ${ok?'green':'orange'}">${ok?'Верно':chosen?'Ошибка':'Нет ответа'}</span></div><div class="q-title">${esc(x.q)}</div>${x.options.map(o=>`<div class="option ${o.correct?'selected':o===chosen?'wrong':''}" style="cursor:default"><span>${o.correct?'✓':o===chosen?'✗':'•'}</span><span>${esc(o.o)}</span></div>`).join('')}<p class="muted" style="font-size:10px;line-height:1.6">${esc(x.explain)}</p></div>`}).join('')}</div><button class="btn" onclick="window.go('control')">Вернуться к контролю</button>`}
function results(){let rs=store.get('quizResults',[]);return `${section('Результаты и оценивание','Локальный журнал контрольных попыток и отправленных работ')}<div class="panel"><div class="panel-head"><h2>Результаты тестирования</h2><button class="btn ghost" onclick="window.exportResults()">Экспорт CSV</button></div>${rs.length?`<div class="table-wrap"><table class="plan-table wide"><thead><tr><th>Дата</th><th>Студент / группа</th><th>Баллы</th><th>Результат</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.name)} · ${esc(r.group)}</td><td>${r.correct}/${r.total} (${r.pct}%)</td><td><span class="tag ${r.pct>=60?'green':'orange'}">${esc(r.grade)}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="empty-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>Пока нет завершённых попыток тестирования.</div>'}</div><div class="panel"><div class="panel-head"><h2>Отправленные задания</h2><small>${submissions.length} работ</small></div>${submissions.length?`<div class="table-wrap"><table class="plan-table wide"><thead><tr><th>Студент</th><th>Группа</th><th>Задание</th><th>Комментарий / ссылка</th><th>Статус</th></tr></thead><tbody>${submissions.map((s,i)=>`<tr><td>${esc(s.name)}</td><td>${esc(s.group)}</td><td>${esc(s.task)}</td><td>${esc(s.comment)}</td><td><select onchange="window.gradeSubmission(${i},this.value)"><option ${s.status==='На проверке'?'selected':''}>На проверке</option><option ${s.status==='Принято'?'selected':''}>Принято</option><option ${s.status==='На доработке'?'selected':''}>На доработке</option></select></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><div class="empty-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></div>Отправленных работ пока нет.</div>'}</div>`}
function gradeSubmission(i,v){submissions[i].status=v;store.set('submissions',submissions);toast('Статус работы обновлён')}

const originals=new WeakMap(), attrOriginals=new WeakMap();
function capLike(src,out){if(src===src.toUpperCase())return out.toUpperCase();if(src[0]===src[0].toUpperCase())return out.charAt(0).toUpperCase()+out.slice(1);return out;}
function translateString(source){
 if(lang==='ru')return source;
 const clean=source.trim();
 const phrases=phrase[lang]||{};
 if(phrases[clean])return source.replace(clean,phrases[clean]);
 let phraseResult=source;
 for(const key of Object.keys(phrases).sort((a,b)=>b.length-a.length)){
   const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   phraseResult=phraseResult.replace(new RegExp('(^|[^\\p{L}\\p{N}_])('+escaped+')(?=$|[^\\p{L}\\p{N}_])','gu'),(m,prefix)=>prefix+phrases[key]);
 }
 const map=dict[lang]||{};
 // Replace longer tokens first; preserve surrounding punctuation and spacing.
 const keys=Object.keys(map).sort((a,b)=>b.length-a.length);
 let result=phraseResult;
 for(const key of keys){
   const escaped=key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
   result=result.replace(new RegExp('(^|[^\\p{L}\\p{N}_])('+escaped+')(?=$|[^\\p{L}\\p{N}_])','gu'),(m,prefix,word)=>prefix+capLike(word,map[key]));
 }
 return result;
}
function translateTextNode(node){
 const current=node.nodeValue;
 const rec=originals.get(node);
 let source=current;
 if(rec){if(current===rec.last)return;source=current;}
 const translated=translateString(source);
 originals.set(node,{source,last:translated});
 if(current!==translated)node.nodeValue=translated;
}
function translateAttr(el,name){
 const val=el.getAttribute(name);if(val==null)return;
 let rec=attrOriginals.get(el);if(!rec){rec={};attrOriginals.set(el,rec);}
 if(rec[name]&&val===rec[name].last)return;
 const source=rec[name]?val:val;
 const translated=translateString(source);
 rec[name]={source,last:translated};
 if(val!==translated)el.setAttribute(name,translated);
}
function walk(root){
 if(root.nodeType===Node.TEXT_NODE){if(root.parentElement&&!['SCRIPT','STYLE'].includes(root.parentElement.tagName))translateTextNode(root);return;}
 if(root.nodeType!==Node.ELEMENT_NODE&&root.nodeType!==Node.DOCUMENT_NODE)return;
 if(root.nodeType===Node.ELEMENT_NODE){
  if(root.matches('input,textarea,button,option,[title],[aria-label]'))['placeholder','title','aria-label','value'].forEach(a=>translateAttr(root,a));
 }
 root.childNodes.forEach(walk);
}
function apply(){document.documentElement.lang=lang;walk(document.body);const sel=document.getElementById('languageSelect');if(sel&&sel.value!==lang)sel.value=lang;document.title=translateString('TIFT • Распределённые системы');}
function setLanguage(next){if(!['ru','uz','en'].includes(next))return;lang=next;localStorage.setItem('tift_language',lang);
 // Restore text nodes to their original Russian source before applying the new language.
 const restore=root=>{if(root.nodeType===Node.TEXT_NODE){const r=originals.get(root);if(r){root.nodeValue=r.source;originals.set(root,{source:r.source,last:r.source});}return;}if(root.nodeType===Node.ELEMENT_NODE){const ar=attrOriginals.get(root);if(ar)Object.keys(ar).forEach(a=>{if(root.hasAttribute(a)){root.setAttribute(a,ar[a].source);ar[a]={source:ar[a].source,last:ar[a].source};}});}if(root.childNodes)root.childNodes.forEach(restore);};
 restore(document.body);
 const sel=document.getElementById('languageSelect');if(sel)sel.value=lang;
 apply();
}
function mount(){

 }
 apply();
}
